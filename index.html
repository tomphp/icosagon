<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Icosagon</title>
    <style>
      html, body { height: 100%; }
      body {
        font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center;
        margin: 0;
      }
      #hud { padding: 16px 16px 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 24px; align-items: center; font-size: 1.2rem; }
      #score-red { color: #c62a2f; }
      #score-blue { color: #2f4eb8; }
      #result { margin: 12px 16px 0; font-size: 1.4rem; font-weight: bold; }
      /* The space left under the HUD; the canvas is sized to fill it. */
      #stage { overflow: hidden; flex: 1; min-height: 0; align-self: stretch; }
      canvas { display: block; touch-action: none; }
    </style>
  </head>
  <body>
    <div id="hud">
      <span id="you" hidden></span>
      <span id="turn"></span>
      <span id="computer-played" hidden></span>
      <label>Play against
        <select id="opponent">
          <option value="human">Human</option>
          <option value="computer">Computer</option>
        </select>
      </label>
      <label>Strategy
        <select id="strategy" disabled>
          <option value="random">Random</option>
          <option value="greedy" selected>Greedy</option>
          <option value="hoarder">Hoarder</option>
          <option value="clever-hoarder">Clever Hoarder</option>
        </select>
      </label>
      <label>Ending
        <select id="ending">
          <option value="award">Award</option>
          <option value="skip">Skip</option>
        </select>
      </label>
      <span id="score-red"></span>
      <span id="score-blue"></span>
      <button id="new-game" type="button">New game</button>
    </div>
    <div id="result" hidden></div>
    <div id="stage"><canvas></canvas></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
