<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Icosagon</title>
    <style>
      html, body { height: 100%; }
      body {
        font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center;
        margin: 0; background: #faf6ef; color: #2b2722;
      }
      /* Fills the window; the canvas is sized to fill it. */
      #stage { overflow: hidden; flex: 1; min-height: 0; align-self: stretch; position: relative; }
      canvas { display: block; touch-action: none; }
      /* Real buttons laid over the canvas buttons: invisible, but they take presses and show keyboard focus. */
      #mirror button {
        position: absolute; padding: 0; border: 0; background: transparent; color: transparent;
        font-size: 0; cursor: pointer;
      }
      #mirror button:focus-visible { outline: 3px solid #e0a43a; outline-offset: 2px; }
      /* Read by screen readers; the canvas draws the same text. */
      .visually-hidden {
        position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="status" class="visually-hidden" aria-live="polite"></div>
    <div id="stage">
      <canvas></canvas>
      <div id="mirror"></div>
      <section id="how-to-play" class="visually-hidden">
        <h2>How to play</h2>
        <ul></ul>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
